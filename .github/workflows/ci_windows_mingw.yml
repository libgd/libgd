name: CI Windows Mingw

on:
  workflow_call:
  workflow_dispatch:

permissions: 
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RELWITHDEBINFO

jobs:


  win-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '⬛', sys: MINGW32 }
          - { icon: '🟦', sys: MINGW64 }
          - { icon: '🟨', sys: UCRT64 } # Experimental!
          - { icon: '🟧', sys: CLANG64 } # Experimental!
    name: 🚧${{ matrix.icon }}-${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
    steps:

    - name: '⚙️ git config'
      run: git config --global core.autocrlf input
      shell: bash

    - name: '🧰 Checkout'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >
          git
          base-devel
          tree
        pacboy: >
          toolchain:p
          libpng:p
          libjpeg-turbo:p
          freetype:p
          libtiff:p
          libwebp:p
          libheif:p
          libraqm:p
          libavif:p
          ${{ matrix.sys != 'MINGW32' && 'libimagequant:p' || '' }}
          xpm-nox:p
          cmake:p
          ninja:p

    - name: '🚧 Cmake Configure'
      run:  |
          cmake -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_PNG=1 -DENABLE_FREETYPE=1 -DENABLE_XPM=1 -DENABLE_JPEG=1 -DENABLE_TIFF=1 -DENABLE_WEBP=1 -DENABLE_TIFF=1 -DENABLE_GD_FORMATS=1 -DENABLE_HEIF=1 -DENABLE_ICONV=1 -DENABLE_CPP=1 -DBUILD_TEST=1 -B.

    - name: Build
      run: cmake --build .

    - name: Run tests
      working-directory: ${{github.workspace}}
      run: |
        mkdir tmp
        mkdir -p debug-artifacts
        export TMP="$PWD/tmp"
        export CTEST_OUTPUT_ON_FAILURE=1
        ctest 2>&1 | tee debug-artifacts/ctest.log

    - name: Collect debug diagnostics
      if: always()
      continue-on-error: true
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p debug-artifacts
        {
          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          echo "PATH=$PATH"
          uname -a
          cmake --version
          gcc --version || true
          clang --version || true
          gdb --version || true
          pkg-config --modversion libpng || true
          pkg-config --libs --cflags libpng || true
          pkg-config --modversion libwebp || true
          pkg-config --libs --cflags libwebp || true
          pkg-config --modversion libwebpdemux || true
          pkg-config --libs --cflags libwebpdemux || true
          pkg-config --modversion libwebpmux || true
          pkg-config --libs --cflags libwebpmux || true
          git rev-parse HEAD || true
          git status --short || true
          find tests/webp/webp-conformance -maxdepth 2 -type f -name '*.webp' | wc -l || true
          find tests/webp/webp-conformance -maxdepth 2 -type f | head -50 || true
          pacman -Q
        } 2>&1 | tee debug-artifacts/environment.txt
        cp CMakeCache.txt debug-artifacts/CMakeCache.txt || true
        cp Testing/Temporary/LastTest.log debug-artifacts/LastTest.log || true
        find tmp -maxdepth 3 -type f -print > debug-artifacts/tmp-files.txt 2>/dev/null || true
        find . -maxdepth 4 -type f \( -name 'gd_test_*.png' -o -name '*.log' -o -name '*.stackdump' -o -name 'core*' \) -print > debug-artifacts/found-debug-files.txt 2>/dev/null || true

    - name: GDB suspect tests
      if: always()
      continue-on-error: true
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p debug-artifacts tmp
        export TMP="$PWD/tmp"
        if command -v gdb >/dev/null 2>&1; then
          if [ -x ./Bin/test_png_bug00033 ]; then
            gdb --batch \
              -ex "set pagination off" \
              -ex "run" \
              -ex "thread apply all bt full" \
              --args ./Bin/test_png_bug00033 \
              > debug-artifacts/gdb-test_png_bug00033.txt 2>&1 || true
          fi
          if [ -x ./Bin/test_webp_webp_conformance ]; then
            gdb --batch \
              -ex "set pagination off" \
              -ex "run" \
              -ex "thread apply all bt full" \
              --args ./Bin/test_webp_webp_conformance \
              > debug-artifacts/gdb-test_webp_webp_conformance.txt 2>&1 || true
          fi
        else
          echo "gdb not found" > debug-artifacts/gdb-missing.txt
        fi

    - name: Upload debug artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mingw-debug-${{ matrix.sys }}
        path: |
          debug-artifacts/**
          tmp/**
        if-no-files-found: warn
